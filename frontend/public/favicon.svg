<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente com os tons de rosé/vinho da marca -->
    <linearGradient id="brandRoseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A56262" />
      <stop offset="100%" stop-color="#844646" />
    </linearGradient>

    <!-- Sombra suave no tom da marca -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#844646" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo Off-White / Cream Suave da marca -->
  <rect width="512" height="512" rx="128" fill="#FAF6F0" />

  <!-- Anel Delicado em Rosé Champanhe -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#C48B8B" stroke-width="8" opacity="0.45" />

  <!-- Letra "H" Serifada Elegante -->
  <g filter="url(#softShadow)" fill="url(#brandRoseGradient)">
    <!-- Haste Esquerda -->
    <path d="M 145 130 h 40 v 20 h -10 v 212 h 10 v 20 h -40 v -20 h 10 V 150 h -10 Z" />
    
    <!-- Traço Central -->
    <rect x="175" y="246" width="162" height="20" rx="3" />
    
    <!-- Haste Direita -->
    <path d="M 327 130 h 40 v 20 h -10 v 212 h 10 v 20 h -40 v -20 h 10 V 150 h -10 Z" />
  </g>
</svg>
